    <path d="M25 24h8l3 7-7 5-7-5z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <text x="78" y="28" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" letter-spacing="-0.5">WCDraft</text>
