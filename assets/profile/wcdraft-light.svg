        <path d="M19 18h19v19H19zM23 28h11M30 23l5 5-5 5" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="52" y="26" fill="#1e293b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650">Accounts, sharing, PWA</text>
