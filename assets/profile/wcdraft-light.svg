        <path d="M18 39V26h7v13M29 39V20h7v19M40 39V15" fill="none" stroke="#4f46e5" stroke-width="2.3" stroke-linejoin="round"/>
        <text x="52" y="26" fill="#1e293b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650">Leaderboards and challenges</text>
        <text x="52" y="45" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13">Casual, ranked, same-seed</text>
      </g>
