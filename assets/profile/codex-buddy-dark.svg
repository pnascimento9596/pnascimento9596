  <g transform="translate(872 56)"><rect width="266" height="42" rx="21" fill="#2e1065" stroke="#6b21a8"/><circle cx="22" cy="21" r="6" fill="#c084fc"/><text x="40" y="27" fill="#e9d5ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">PRIVATE RELEASE CANDIDATE</text></g>
