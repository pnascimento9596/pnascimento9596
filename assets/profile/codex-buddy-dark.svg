      <g transform="translate(28 72)"><rect width="246" height="52" rx="14" fill="#2e1065"/><path d="M19 17v20M19 21h11M30 21v12M30 27h10" fill="none" stroke="#c084fc" stroke-width="2.2" stroke-linecap="round"/><circle cx="19" cy="17" r="3" fill="#c084fc"/><circle cx="30" cy="33" r="3" fill="#c084fc"/><circle cx="40" cy="27" r="3" fill="#c084fc"/><text x="52" y="32" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">Start and finish Git trees</text></g>
