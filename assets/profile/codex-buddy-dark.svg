<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Codex Buddy Reviewer evidence flow</title>
  <desc id="desc">Stable Git snapshots produce a bounded allowlisted patch for an isolated independent reviewer. Local validation produces attributed findings, a durable receipt, and separate pet companion state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#160b24"/><stop offset="0.55" stop-color="#0f172a"/><stop offset="1" stop-color="#2e1065"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7e22ce"/><stop offset="1" stop-color="#c026d3"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#c084fc" stroke-opacity="0.09"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.34"/></filter>
  </defs>
  <rect width="1200" height="620" rx="30" fill="url(#bg)"/><rect width="1200" height="620" rx="30" fill="url(#grid)"/><circle cx="1104" cy="76" r="150" fill="#9333ea" fill-opacity="0.15"/><circle cx="1104" cy="76" r="98" fill="#d946ef" fill-opacity="0.11"/>
