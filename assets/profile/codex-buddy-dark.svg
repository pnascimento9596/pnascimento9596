      <g transform="translate(28 144)"><rect width="246" height="58" rx="14" fill="#3b0b43"/><path d="M18 17h20v24l-5-4-5 4-5-4-5 4zM23 24h10M23 30h8" fill="none" stroke="#e879f9" stroke-width="2" stroke-linejoin="round"/><text x="52" y="26" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">Durable receipt</text><text x="52" y="45" fill="#a1a1aa" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13">Deterministic run record</text></g>
      <g transform="translate(28 216)"><rect width="246" height="58" rx="14" fill="#3b0b43"/><circle cx="21" cy="23" r="4" fill="#e879f9"/><circle cx="35" cy="23" r="4" fill="#e879f9"/><path d="M21 37c0-7 3-11 7-11s7 4 7 11c0 4-3 6-7 3-4 3-7 1-7-3z" fill="#e879f9"/><text x="52" y="26" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">Five pet companions</text><text x="52" y="45" fill="#a1a1aa" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13">Cosmetic state stays separate</text></g>
