      <path d="M46 192v24" stroke="#d8b4fe" stroke-width="2" stroke-dasharray="4 5"/><g transform="translate(28 220)"><circle cx="18" cy="18" r="18" fill="#ffffff" fill-opacity="0.15"/><path d="M10 18l5 5 11-12" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="16" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Local finding validation</text><text x="52" y="39" fill="#f3e8ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14">Evidence and line checks</text></g>
