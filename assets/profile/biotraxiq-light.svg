<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">BiotraxIQ product flow</title>
  <desc id="desc">RFP bids, equipment inventories, CMMS work orders, spend, and service contracts move through governed clinical engineering analysis to comparable proposals, fleet and capital priorities, reports, and scoped chat.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#99f6e4" stroke-opacity="0.24"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#134e4a" flood-opacity="0.09"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="620" rx="30" fill="url(#grid)"/>
  <circle cx="1104" cy="76" r="150" fill="#5eead4" fill-opacity="0.10"/>
  <circle cx="1104" cy="76" r="98" fill="#22d3ee" fill-opacity="0.08"/>

  <g transform="translate(54 48)">
