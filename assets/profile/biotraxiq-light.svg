  <g fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M375 306h48"/>
    <path d="M413 296l10 10-10 10"/>
    <path d="M770 306h48"/>
    <path d="M808 296l10 10-10 10"/>
