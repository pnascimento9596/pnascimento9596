      <path d="M46 192v24" stroke="#5eead4" stroke-width="2" stroke-dasharray="4 5"/>
      <g transform="translate(28 220)">
        <circle cx="18" cy="18" r="18" fill="#ffffff" fill-opacity="0.14"/>
        <text x="18" y="24" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">3</text>
        <text x="52" y="16" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Ground contract evidence</text>
        <text x="52" y="39" fill="#ccfbf1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14">Clauses, redlines, reports, chat</text>
      </g>
    </g>

    <g transform="translate(844 154)">
      <rect width="302" height="304" rx="24" fill="#ffffff" stroke="#cffafe"/>
      <text x="28" y="43" fill="#0891b2" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">RESULTS</text>
      <g transform="translate(28 72)">
