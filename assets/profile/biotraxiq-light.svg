    <text x="26" y="29" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">FOUNDATION</text>
    <text x="26" y="53" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650">Deterministic intake</text>
    <circle cx="204" cy="48" r="3" fill="#2dd4bf"/>
    <text x="222" y="53" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650">Source provenance</text>
    <circle cx="386" cy="48" r="3" fill="#2dd4bf"/>
    <text x="404" y="53" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650">Typed unavailable states</text>
    <circle cx="614" cy="48" r="3" fill="#2dd4bf"/>
    <text x="632" y="53" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650">Workspace scope</text>
    <circle cx="786" cy="48" r="3" fill="#2dd4bf"/>
    <text x="804" y="53" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650">Evidence-linked artifacts</text>
