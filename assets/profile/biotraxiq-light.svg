      <g transform="translate(28 146)">
        <circle cx="18" cy="18" r="18" fill="#ffffff" fill-opacity="0.14"/>
        <text x="18" y="24" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">2</text>
        <text x="52" y="16" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Connect fleet and spend</text>
        <text x="52" y="39" fill="#ccfbf1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14">Reliability, lifecycle, coverage</text>
