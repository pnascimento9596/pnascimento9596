      <text x="28" y="43" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">SOURCE DATA</text>
      <g transform="translate(28 72)">
