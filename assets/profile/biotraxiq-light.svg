        <text x="52" y="16" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Normalize bid models</text>
        <text x="52" y="39" fill="#ccfbf1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14">Cost, scope, risk, and TCO</text>
