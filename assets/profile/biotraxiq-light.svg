      </g>
      <g transform="translate(28 144)">
        <rect width="246" height="58" rx="14" fill="#ecfeff"/>
        <path d="M18 38l8-12 7 6 9-15" fill="none" stroke="#0891b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="52" y="26" fill="#1e293b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">Fleet and capital priorities</text>
        <text x="52" y="45" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13">With coverage disclosure</text>
      </g>
      <g transform="translate(28 216)">
        <rect width="246" height="58" rx="14" fill="#ecfeff"/>
        <path d="M19 19h18v20H19zM23 24h10M23 29h10M23 34h6" fill="none" stroke="#0891b2" stroke-width="2" stroke-linecap="round"/>
        <text x="52" y="26" fill="#1e293b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">Reports and scoped chat</text>
        <text x="52" y="45" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13">PDF, DOCX, XLSX, MCP</text>
      </g>
    </g>
