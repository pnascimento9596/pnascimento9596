    <path d="M18 30h22M29 19v22M21 22l16 16M37 22L21 38" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.88"/>
    <circle cx="29" cy="30" r="6" fill="#ffffff"/>
    <text x="78" y="28" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" letter-spacing="-0.5">BiotraxIQ</text>
    <text x="78" y="54" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17">Clinical engineering intelligence</text>
  </g>
  <g transform="translate(846 56)">
